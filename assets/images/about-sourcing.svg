      <stop offset="0%" stop-color="#0e1b36"/>
      <stop offset="100%" stop-color="#16294f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a457a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1b36" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#abg)"/>
  <circle cx="300" cy="225" r="160" fill="url(#glow)"/>
  <!-- Compass lines -->
